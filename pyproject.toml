[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-substrait"
version = "2.0.0"
description = "Self-Organizing Lifelong Mixture-of-Experts with Complex Phasor Hyperspace Routing and Biological Clonal Mitosis"
authors = [{ name = "Universal Substrait Team" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "tiktoken>=0.6.0",
    "datasets>=2.18.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-benchmark>=4.0.0",
]
