[package]
name = "rust_yggdrasil"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity & Gemini Pair Programming"]
description = "High-performance, memory-safe GPU/CPU kernel for the Yggdrasil Geometric Manifold"

[lib]
name = "yggdrasil_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
rayon = "1.12.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
